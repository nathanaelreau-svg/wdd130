<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Homepage</title>
    <meta name="description" content="Homepage of White Water Rafting showcasing what to expect from the company.">
    <meta name="author" content="Nathanaël Réau">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

    <header>
        <img src="images/z-splash.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/river.jpg" alt="White water river photo">

            <h1>Adventure Awaits YOU on the River!</h1>
        

            <section class="home-cta">
                <h2>Make new Memories on White Water</h2>

                <a href="trips.html" class="trips-button">
                    Book Now
                </a>
            </section>
        </div>

        <section class="home-content">
            <figure class="home-card">
                <img src="images/index1.jpg" alt="Rafting guide helping a group prepare for the adventure.">
            
                <figcaption class="home-card-text">
                    <h2>Our Mission</h2>
                    <p>We will help you safely enjoy White Water to the fullest!</p>
                </figcaption>
            </figure>

            <figure class="home-card">
                <img src="images/index2.jpg" alt="A group paddling rapids.">

                <figcaption class="home-card-text">
                    <h2>Your Adventure</h2>
                    <p>Experience a range of adventures through gentle river to exciting rapids!</p>
                </figcaption>
            </figure>

            <figure class="home-card">
                <img src="images/index3.jpg" alt="Beautiful rafting river scenery.">

                <figcaption class="home-card-text">
                    <h2>Enjoy Nature</h2>
                    <p>Discover new landscapes and create unforgettable memories!</p>
                </figcaption>
            </figure>
        </section>

        <section class="newsletter">
            <h2>Join The White Water Newsletter</h2>

            <p>Sign up to receive rafting news, adventure tips, and updates about our upcoming trips.</p>

            <form action="#" method="post">
                <div class="newsletter-field">
                    <label for="newsletter-name">Name:</label>
                    <input type="text" id="newsletter-name" name="name" required>
                </div>

                <div class="newsletter-field">
                    <label for="newsletter-email">Email:</label>
                    <input type="email" id="newsletter-email" name="email" required>
                </div>

                <button type="submit">Sign me Up!</button>
            </form>
        </section>
    </main>

    <footer>
        <p>©️2026 | Nathanaël Réau | White Water Rafting</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"> <img src="images/facebook-icon.png" alt="Facebook icon"></a>
            <a href="https://linkedin.com"> <img src="images/linkedin-icon.png" alt="Linkedin icon"></a>
            <a href="https://instagram.com"> <img src="images/instagram-icon.png" alt="Instagram icon"></a>
        </nav>
    </footer>
</body>
</html>
