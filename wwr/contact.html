<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description" content="Showcasing all of White Water Rafting Contacts, the team member and a form to send a message">
    <meta name="author" content="Nathanaël Réau">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

    <header>
        <img src="images/z-splash.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <section class="company-info">
            <p><strong>Address: </strong>123 White River Street</p>
            <p><strong>Phone: </strong>+1 555-123-5555</p>
            <p><strong>Email: </strong>info@whitewaterrafting.com</p>
        </section>
        
        <div class="contact-layout">

            <section class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d17252.18277678975!2d1.7744978286357915!3d47.86401630028777!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2sfr!4v1791665640926!5m2!1sfr!2sfr" width="600" 
                height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </section>

            <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <div class="form-item">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <div>
                        <label for="general">General Inquiry</label>
                        <input type="radio" id="general" name="purpose" value="general-inquiry" required>
                    </div>

                    <div>
                        <label for="reservation">Reservation Question</label>
                        <input type="radio" id="reservation" name="purpose" value="reservation-question">
                    </div>

                    <div>
                        <label for="suggestion">Website Suggestion</label>
                        <input type="radio" name="purpose" id="suggestion" value="website-suggestion">
                    </div>
                </fieldset>

                <div class="form-item">
                    <label for="message">Your Message</label>
                    <textarea name="message" id="message" rows="5" required></textarea>
                </div>

                <div class="form-item">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                </div>

                <button type="submit">Send Message</button>

            </form>
            </section>

        </div>

        

        <section class="employees">
            <h2>Meet the Team !</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Portrait of Alex, rafting tour guide">
                <figcaption>Alex Doyle - Tour Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Portrait of Sammy, equipment specialist">
                <figcaption>Sammy Han - Equipment Specialist</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Portrait of Marc, customer service manager">
                <figcaption>Marc Doe - Manager</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>©️2026 | Nathanaël Réau | White Water Rafting</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"> <img src="images/facebook-icon.png" alt="Facebook icon"></a>
            <a href="https://linkedin.com"> <img src="images/linkedin-icon.png" alt="Linkedin icon"></a>
            <a href="https://instagram.com"> <img src="images/instagram-icon.png" alt="Instagram icon"></a>
        </nav>
    </footer>
</body>
</html>
